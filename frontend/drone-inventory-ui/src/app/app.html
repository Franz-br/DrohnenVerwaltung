<header class="app-header">
  <p class="app-title">Drone Lending System</p>
  <nav aria-label="Main">
    <ul>
      @for (link of links; track link.path) {
        <li>
          <a
            [routerLink]="link.path"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            ariaCurrentWhenActive="page"
            >{{ link.label }}</a
          >
        </li>
      }
    </ul>
  </nav>
</header>

<main class="app-main">
  <router-outlet />
</main>
